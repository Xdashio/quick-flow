name: Release

# Builds production installers and publishes them to GitHub Releases.
# Trigger: push a version tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`
# Result: a `v0.1.0` release page with Linux (AppImage + .deb) and
# Windows (.exe) installers attached. macOS is one matrix entry away
# (needs a macos runner) — the icon (build/icon.icns) is already in place.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installers (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm run electron:build:linux --workspace=register

      - name: Build installers (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run electron:build:win --workspace=register

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          # Explicit extensions only: keeps out .blockmap / .yml metadata.
          path: |
            register/release/*.AppImage
            register/release/*.deb
            register/release/*.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers

      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
